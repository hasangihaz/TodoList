<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">My To-Do List</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="todo-card mx-auto">

            <div class="text-center mb-4">
                <h1 class="page-title">Task Manager</h1>
                <p class="text-muted">
                    Organize your tasks and stay productive.
                </p>
            </div>

            <form id="taskForm" class="mb-2">
                <div class="input-group">
                    <input
                        type="text"
                        id="taskInput"
                        class="form-control"
                        placeholder="Enter a new task..."
                        maxlength="150"
                    >
                    <button type="submit" class="btn btn-primary px-4">
                        Add Task
                    </button>
                </div>
                <p id="errorMessage" class="error-message" role="alert"></p>
            </form>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted" style="font-size: 0.95rem;">Your tasks</span>
                <span id="taskCounter" class="task-counter fw-bold">
                    0 remaining
                </span>
            </div>

            <div class="btn-group w-100 mb-4 filter-buttons" role="group" aria-label="Filter tasks">
                <button type="button" class="btn filter-btn active" data-filter="all">
                    All
                </button>
                <button type="button" class="btn filter-btn" data-filter="active">
                    Active
                </button>
                <button type="button" class="btn filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <ul id="taskList" class="list-group task-list"></ul>

            <div id="emptyMessage" class="empty-message text-center py-4">
                No tasks available yet. Add a task to get started.
            </div>

            <div class="d-flex justify-content-end mt-4">
                <button
                    type="button"
                    id="clearCompleted"
                    class="btn btn-outline-danger btn-sm"
                >
                    Clear Completed
                </button>
            </div>

        </div>
    </main>

    <footer class="text-center py-3">
        <small>My To-Do List | Simple daily task management</small>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
